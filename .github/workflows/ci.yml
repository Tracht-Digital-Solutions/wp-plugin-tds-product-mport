name: CI

on:
  push:
    tags-ignore:
      - 'v*'
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: composer test
      - run: composer lint
      - run: composer analyse
      - run: npm run lint:js
      - run: npm run test:js
      - run: npm run build

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - tests/env/wp-min.json
          - tests/env/wp-target.json
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: composer install --no-interaction --prefer-dist
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx wp-env start --config=${{ matrix.environment }}
      - name: Run WooCommerce integration tests
        run: >-
          npx wp-env --config=${{ matrix.environment }} run cli sh -- -lc
          'PLUGIN_DIR=$(dirname "$(find wp-content/plugins -name tds-product-importer.php -print -quit)");
          WC_PLUGIN_FILE=$(find /var/www/html/wp-content/plugins -path "*/woocommerce.php" -print -quit);
          cd "$PLUGIN_DIR" && WC_PLUGIN_FILE="$WC_PLUGIN_FILE" ./vendor/bin/phpunit -c phpunit.integration.xml.dist --exclude-group scale'
      - name: Stop test environment
        if: always()
        run: npx wp-env stop --config=${{ matrix.environment }}

  scale:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: composer install --no-interaction --prefer-dist
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx wp-env start --config=tests/env/wp-target.json
      - name: Run 25,000-record scale tests
        run: >-
          npx wp-env --config=tests/env/wp-target.json run cli sh -- -lc
          'PLUGIN_DIR=$(dirname "$(find wp-content/plugins -name tds-product-importer.php -print -quit)");
          WC_PLUGIN_FILE=$(find /var/www/html/wp-content/plugins -path "*/woocommerce.php" -print -quit);
          cd "$PLUGIN_DIR" && WC_PLUGIN_FILE="$WC_PLUGIN_FILE" ./vendor/bin/phpunit -c phpunit.integration.xml.dist --group scale'
      - name: Stop scale environment
        if: always()
        run: npx wp-env stop --config=tests/env/wp-target.json

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: composer install --no-interaction --prefer-dist
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npx wp-env start --config=tests/env/wp-target.json
      - run: npm run test:e2e
      - name: Stop browser environment
        if: always()
        run: npx wp-env stop --config=tests/env/wp-target.json
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  plugin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: composer install --no-dev --classmap-authoritative --no-interaction --prefer-dist
      - run: npm run package
      - uses: wordpress/plugin-check-action@v1
        with:
          build-dir: './dist/tds-product-importer'
          exclude-directories: 'vendor'
          ignore-codes: |
            WordPress.Security.EscapeOutput.ExceptionNotEscaped
            WordPress.DB.DirectDatabaseQuery.DirectQuery
            WordPress.DB.DirectDatabaseQuery.NoCaching
            WordPress.DB.SlowDBQuery.slow_db_query_meta_key
            WordPress.DB.SlowDBQuery.slow_db_query_meta_value
            PluginCheck.Security.DirectDB.UnescapedDBParameter
          ignore-warnings: false
          include-experimental: false
